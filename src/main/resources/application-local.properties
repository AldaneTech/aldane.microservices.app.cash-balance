spring.config.import=optional:file:./.local-secrets.properties
logging.config=classpath:log4j2-local.xml
logging.level.org.springframework.security=DEBUG

server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/cash-balance?currentSchema=public
