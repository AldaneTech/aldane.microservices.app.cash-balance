name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.0.0."
            exit 1
          fi
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$VERSION" != "$POM_VERSION" ]]; then
            echo "Tag version $VERSION does not match POM version $POM_VERSION."
            exit 1
          fi
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode clean verify

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build versioned image
        run: docker build -t "ghcr.io/aldanetech/aldane.microservices.app.cash-balance:$IMAGE_VERSION" .

      - name: Push versioned image
        run: docker push "ghcr.io/aldanetech/aldane.microservices.app.cash-balance:$IMAGE_VERSION"
